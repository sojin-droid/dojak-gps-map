<script>
var map = L.map('map', {zoomControl: true}).setView([37.3, 127.0], 8);
var osm = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {maxZoom: 19,
  attribution: 'Tiles &copy; Esri'}).addTo(map);
var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom: 19,
  attribution: 'Tiles &copy; Esri'});

function icon(cat, size) {
  return L.icon({iconUrl: ICONS[cat], iconSize: [size, size], iconAnchor: [size/2, size/2], popupAnchor: [0, -size/2]});
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// 라이트박스
var lbList = [], lbIdx = 0;
function openLb(list, i) { lbList = list; lbIdx = i; showLb(); document.getElementById('lb').classList.add('on'); }
function showLb() { var p = lbList[lbIdx]; document.getElementById('lbimg').src = p.photo;
  document.getElementById('lbcap').textContent = (lbIdx+1) + '/' + lbList.length + ' · IMG_' + p.photo_no + ' · ' + p.date + ' ' + p.time + ' · ' + p.caption; }
document.getElementById('lbx').onclick = function () { document.getElementById('lb').classList.remove('on'); };
document.getElementById('lbp').onclick = function () { lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; showLb(); };
document.getElementById('lbn').onclick = function () { lbIdx = (lbIdx + 1) % lbList.length; showLb(); };
document.addEventListener('keydown', function (e) {
  if (!document.getElementById('lb').classList.contains('on')) return;
  if (e.key === 'Escape') document.getElementById('lbx').onclick();
  if (e.key === 'ArrowLeft') document.getElementById('lbp').onclick();
  if (e.key === 'ArrowRight') document.getElementById('lbn').onclick();
});
window.__lb = {};

var allPhotos = json_사진지점.features.map(function (f) { return f.properties; });

function photoPopup(p) {
  var list = allPhotos.filter(function (q) { return q.date === p.date; });
  var i = list.findIndex(function (q) { return q.photo_no === p.photo_no; });
  window.__lb[p.photo_no] = function () { openLb(list, i); };
  return '<div class="pop"><h3>' + esc(p.site_name) + '</h3>' +
    '<div class="meta">' + esc(p.day) + ' · ' + esc(p.time) + ' · ' + esc(p.cat_label) + '</div>' +
    '<p>' + esc(p.caption) + '</p><table>' +
    '<tr><th>순서</th><td>' + p.date.slice(5).replace('-', '/') + ' #' + p.seq + '</td></tr>' +
    '<tr><th>사진번호</th><td>IMG_' + p.photo_no + '</td></tr>' +
    '<tr><th>세부주제</th><td>' + esc(p.topic) + '</td></tr>' +
    '<tr><th>좌표</th><td>' + p.lat.toFixed(5) + ', ' + p.lon.toFixed(5) + '</td></tr>' +
    (p.drive_link ? '<tr><th>자료</th><td><a href="' + esc(p.drive_link) + '" target="_blank">구글드라이브</a></td></tr>' : '') +
    '</table></div>';
}
function sitePopup(s) {
  var list = allPhotos.filter(function (q) { return q.site_id === s.site_id; });
  var key = 's_' + s.site_id;
  window.__lb[key] = function (i) { openLb(list, i); };
  return '<div class="pop"><h3>' + esc(s.name) + '</h3>' +
    '<div class="meta">' + esc(s.day) + ' · ' + esc(s.time) + ' · ' + esc(s.cat_label) + '</div>' +
    '<p>' + esc(s.description) + '</p>' +
    '<div class="meta" style="margin-top:6px">촬영 사진 ' + s.n_photos + '장 (이 공유본에는 사진을 싣지 않았습니다)</div></div>';
}

var overlays = {}, dayLayers = {};
// 이동경로
var routes = L.geoJSON(json_이동경로, {style: function (f) { return {color: DAYCOL[f.properties.date], weight: 3, opacity: .75, dashArray: '6 5'}; },
  onEachFeature: function (f, l) { l.bindPopup('<b>' + esc(f.properties.day) + '</b><br>' + f.properties.start + '~' + f.properties.end + ' · 사진 ' + f.properties.n_points + '장'); }});
// 날짜별 사진 레이어(클러스터)
Object.keys(DAYS).forEach(function (d) {
  var cl = L.markerClusterGroup({maxClusterRadius: 40, spiderfyDistanceMultiplier: 1.6,
    iconCreateFunction: function (c) { var n = c.getChildCount(), s = n > 30 ? 44 : n > 9 ? 38 : 32;
      return L.divIcon({html: '<div class="cl" style="width:' + s + 'px;height:' + s + 'px;background:' + DAYCOL[d] + '">' + n + '</div>', className: '', iconSize: [s, s]}); }});
  L.geoJSON(json_사진지점, {filter: function (f) { return f.properties.date === d; },
    pointToLayer: function (f, ll) { return L.marker(ll, {icon: icon(f.properties.category, 26), title: f.properties.caption}); },
    onEachFeature: function (f, l) { l.bindPopup(function () { return photoPopup(f.properties); }, {maxWidth: 320}); }}).addTo(cl);
  dayLayers[d] = cl;
  overlays['<span style="color:' + DAYCOL[d] + '">●</span> 사진 ' + DAYS[d]] = cl;
  cl.addTo(map);
});
var sites = L.geoJSON(json_답사현장, {
  pointToLayer: function (f, ll) { return L.marker(ll, {icon: icon(f.properties.category, 40), zIndexOffset: 1000}); },
  onEachFeature: function (f, l) { l.bindPopup(function () { return sitePopup(f.properties); }, {maxWidth: 320});
    l.bindTooltip(f.properties.name, {direction: 'top', offset: [0, -20]}); }}).addTo(map);
routes.addTo(map);
overlays['답사현장'] = sites; overlays['이동경로(사진 순서)'] = routes;
L.control.layers({'기본 지도(Esri)': osm, '위성영상(Esri)': sat}, overlays, {collapsed: true, position: 'topright'}).addTo(map);
L.control.scale({imperial: false}).addTo(map);

// 날짜 버튼
var btns = document.getElementById('days');
function addBtn(label, d, col) {
  var b = document.createElement('button'); b.textContent = label;
  b.onclick = function () {
    [].forEach.call(btns.children, function (x) { x.classList.remove('on'); x.style.background = ''; });
    b.classList.add('on'); b.style.background = col;
    var feats = json_사진지점.features.filter(function (f) { return !d || f.properties.date === d; });
    map.fitBounds(L.geoJSON({type: 'FeatureCollection', features: feats}).getBounds(), {paddingTopLeft: [40, 130], paddingBottomRight: [40, 40], maxZoom: 15});
  };
  btns.appendChild(b); return b;
}
addBtn('전체', null, '#555').click();
Object.keys(DAYS).forEach(function (d) { addBtn(DAYS[d].split(' ')[0], d, DAYCOL[d]); });

// 범례
var lg = document.getElementById('legend'), used = {};
allPhotos.forEach(function (p) { used[p.category] = 1; });
json_답사현장.features.forEach(function (f) { used[f.properties.category] = 1; });
Object.keys(CATS).forEach(function (k) { if (used[k]) lg.insertAdjacentHTML('beforeend', '<div class="row"><img src="' + ICONS[k] + '" alt="">' + CATS[k].label + '</div>'); });
Object.keys(DAYS).forEach(function (d) { lg.insertAdjacentHTML('beforeend', '<div class="row"><span style="display:inline-block;width:18px;border-top:3px dashed ' + DAYCOL[d] + '"></span>' + DAYS[d] + '</div>'); });
</script>
</body>
</html>
